# Baut die App und stellt sie über GitHub Pages online.
# Läuft bei jedem Push auf main oder per Knopf "Run workflow" im Reiter Actions.
name: App online stellen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # Die Version für claude.ai als eine Datei ablegen (Reiter Actions, Lauf öffnen, unten „Artifacts“).
      - run: npm run build:claude
      - uses: actions/upload-artifact@v7
        with:
          name: livion-claude
          path: dist-claude/livion.html
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
